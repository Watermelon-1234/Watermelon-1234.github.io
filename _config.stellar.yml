logo:
  avatar: '[{config.avatar}](/about/)' # you can set avatar link in _config.yml or '[https://xxx.png](/about/)'
  title: '[{config.title}](/)' # you can set html tag like: '[<img no-lazy height="32px" src="xxx"/>](/)'

  subtitle: 'A limited life, immortalized in a commit.|Welcome to my blog!'

article:
  type: tech # tech/story

  # npm i hexo-related-popular-posts
  related_posts:
    enable: true
    title: 相關文章

  license: '本文採用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode.en) 開源協議。'
  share: [email, link]

menubar:
  items: 
    - id: post
      theme: '#1BCDFC'
      icon: book
      title: 部落格
      url: /
    # todo!!!!QAQ(IDK what to put)
    # - id: explore
    #   theme: '#FA6400'
    #   icon: camp
    #   title: 探索
    #   url: /explore/
    - id: social
      theme: '#F44336'
      icon: cat
      title: 關於
      url: /about/

# 文章搜索
search:
  service: local_search # local_search, todo...
  local_search:
    field: all # post, page, all
    path: /search.json # 搜索文件存放位置
    content: true # 是否搜索内容
    skip_search: [] # 指定 path 中的内容不被搜索。
    codeblock: true # 是否搜索代码块（需要content: true)

footer:
